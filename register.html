<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>РЕГИСТРАЦИЯ</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="img/mini_logo.svg" sizes="any">
  <style>
    .auth-message { margin: 12px 0; font-size: 14px; line-height: 1.5; }
    .auth-message.error { color: #b42318; }
    .auth-message.success { color: #18723b; }
    .btn:disabled { opacity: .65; cursor: wait; }
  </style>
</head>
<body>
  <main class="auth">
    <a class="logo-slot" href="index.html"><img src="img/logo.png" alt="На главную"></a>
    <h1 class="auth__title">создайте аккаунт</h1>
    <form class="form" id="register-form">
      <input class="field" type="text" name="name" placeholder="имя" autocomplete="name" aria-label="Имя" minlength="2" maxlength="40" required>
            <input class="field" type="password" name="password" placeholder="пароль (не менее 6 символов)" autocomplete="new-password" aria-label="Пароль" minlength="6" required>
      <input class="field" type="password" name="password2" placeholder="повторите пароль" autocomplete="new-password" aria-label="Повторите пароль" required>
      <button class="btn" id="register-button" type="submit">Зарегистрироваться</button>
      <p class="auth-message" id="auth-message" role="status"></p>
    </form>
    <p class="auth__note">если у вас уже есть аккаунт, то <a href="login.html">войдите</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const message = document.getElementById('auth-message');
    const button = document.getElementById('register-button');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.className = 'auth-message';
      const name = form.elements.name.value.trim();
      const password = form.elements.password.value;
      const password2 = form.elements.password2.value;
      if (password !== password2) {
        message.textContent = 'Пароли не совпадают.';
        message.classList.add('error');
        form.elements.password2.focus();
        return;
      }
      button.disabled = true;
      button.textContent = 'Создаём аккаунт…';
      try {
        // Используем технический email, который формируется из имени пользователя.
        // Почта не нужна для входа; в Supabase нужно отключить Email confirmations.
        const username = name.toLowerCase();
        const usernameCode = Array.from(username).map(ch => ch.codePointAt(0).toString(16)).join('-');
        const email = `u${usernameCode}@accounts.citymap.invalid`;
        const { data, error } = await window.citySupabase.auth.signUp({
          email,
          password,
          options: { data: { username: name, display_name: name } }
        });
        if (error) throw error;
        if (!data.session) {
          throw new Error('В Supabase всё ещё включено подтверждение Email. Отключите его в настройках Auth.');
        }
        message.textContent = 'Аккаунт создан! Сейчас откроется сайт.';
        message.classList.add('success');
        setTimeout(() => location.href = 'index.html', 900);
      } catch (err) {
        message.textContent = window.ruError(err, 'Не удалось зарегистрироваться. Попробуйте ещё раз.');
        message.classList.add('error');
        button.disabled = false;
        button.textContent = 'Зарегистрироваться';
      }
    });
  </script>
</body>
</html>
